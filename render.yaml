services:
  - type: web
    name: soulrip-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m scripts.seed_data
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./soulrip.db
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ADMIN_KEY
        sync: false
